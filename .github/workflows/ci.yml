name: MICRA CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies in canonical order
        run: |
          pnpm --filter @micra/domain-types build
          pnpm --filter @micra/api-contracts build
          pnpm --filter @micra/api build
          pnpm --filter @micra/database generate
          pnpm --filter @micra/web build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Prisma schema generation
        run: pnpm --filter @micra/database generate
